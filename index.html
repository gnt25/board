<!DOCTYPE html>
<html lang="mn" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Самбар Илтгэл</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#0A0D13; --stage:#04060A;
  --ui:rgba(23,27,37,.93); --ui-solid:#171B25; --ui2:#232938; --ui3:#2C3346;
  --line:rgba(255,255,255,.08); --tx:#ECEFF6; --tx2:#98A1B6; --tx3:#646D82;
  --acc:#6E7CFF; --acc-soft:rgba(110,124,255,.16); --amb:#F7B32B; --ok:#22C38E; --bad:#FF5C7A; --cyan:#22B8E0;
  --shadow:0 18px 50px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);
  --font:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
[data-theme=light]{
  --page:#EDF0F5;
  --ui:rgba(255,255,255,.95); --ui-solid:#FFFFFF; --ui2:#F0F2F7; --ui3:#E3E7EF;
  --line:rgba(16,22,40,.10); --tx:#141926; --tx2:#596278; --tx3:#8C94A7;
  --acc-soft:rgba(110,124,255,.12);
  --shadow:0 18px 50px rgba(20,30,70,.18),0 2px 8px rgba(20,30,70,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--page);color:var(--tx);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;font-family:inherit;color:inherit}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--ui3);border-radius:10px;border:3px solid transparent;background-clip:padding-box}

/* ---------- common controls ---------- */
.btn{height:44px;padding:0 16px;border-radius:12px;background:var(--ui2);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn:hover{background:var(--ui3)}
.btn.pri{background:var(--acc);color:#fff}.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn.ghost{background:transparent}.btn.ghost:hover{background:var(--ui2)}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.lg{height:54px;padding:0 22px;font-size:16px;border-radius:14px}
.ib{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;transition:background .15s;flex:none}
.ib:hover{background:var(--ui2)}.ib.on{background:var(--acc);color:#fff}
.ib.sm{width:36px;height:36px;border-radius:10px}.ib.sm svg.i{width:19px;height:19px}
.inp,.sel{height:42px;border-radius:11px;border:1px solid var(--line);background:var(--ui2);padding:0 12px;font-size:15px;outline:none;width:100%}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;line-height:1.5}
.inp:focus,.sel:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.seg{display:inline-flex;background:var(--ui2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{height:36px;padding:0 13px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--tx2)}
.seg button.on{background:var(--ui-solid);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.18)}
[data-theme=dark] .seg button.on{background:var(--ui3)}
.lbl{font-size:12px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;display:block}
.row{display:flex;gap:8px;align-items:center}.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.muted{color:var(--tx2)}.small{font-size:12.5px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);flex:none}
.sw.on{border-color:var(--tx);transform:scale(1.08)}
.toggle{position:relative;width:46px;height:28px;border-radius:20px;background:var(--ui3);transition:background .2s;flex:none}
.toggle::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle.on{background:var(--acc)}.toggle.on::after{transform:translateX(18px)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:var(--ui3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--acc);margin-top:-9px;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:var(--ui3)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--acc);border:3px solid #fff}

/* ---------- home ---------- */
#home{position:fixed;inset:0;overflow:auto;background:
  radial-gradient(1100px 600px at 85% -10%,rgba(110,124,255,.20),transparent 60%),
  radial-gradient(800px 500px at -10% 110%,rgba(247,179,43,.10),transparent 60%),var(--page)}
.home-in{max-width:1180px;margin:0 auto;padding:44px 32px 60px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--acc),#9B6CFF);display:grid;place-items:center;color:#fff;box-shadow:0 8px 24px rgba(110,124,255,.4)}
.logo svg.i{width:26px;height:26px}
.brand h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.brand p{font-size:13px;color:var(--tx2)}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;margin-top:38px;align-items:stretch}
.hero h2{font-size:clamp(30px,4vw,48px);font-weight:800;line-height:1.06;letter-spacing:-.03em}
.hero h2 em{font-style:normal;background:linear-gradient(90deg,var(--acc),#B07CFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{font-size:16px;color:var(--tx2);margin:14px 0 22px;max-width:520px;line-height:1.55}
.drop{border:2px dashed color-mix(in srgb,var(--acc) 55%,transparent);border-radius:24px;background:var(--acc-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:34px 20px;text-align:center;transition:all .2s;cursor:pointer;min-height:250px}
.drop.over{background:color-mix(in srgb,var(--acc) 28%,transparent);transform:scale(1.01)}
.drop .big{width:64px;height:64px;border-radius:20px;background:var(--acc);color:#fff;display:grid;place-items:center}
.drop .big svg.i{width:30px;height:30px}
.drop b{font-size:18px}.drop span{color:var(--tx2);font-size:13.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:30px;padding:0 12px;border-radius:20px;background:var(--ui2);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--tx2)}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:44px 0 14px}
.sec-h h3{font-size:18px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--ui-solid);border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card .cv{aspect-ratio:16/9;position:relative;display:flex;align-items:flex-end;padding:14px;color:#fff;background-size:cover;background-position:center}
.card .cv .t{font-weight:700;font-size:16px;line-height:1.25;text-shadow:0 1px 8px rgba(0,0,0,.5);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .kind{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);letter-spacing:.05em}
.card .meta{padding:12px 14px;display:flex;align-items:center;gap:8px}
.card .meta .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:4px;background:var(--ui3);border-radius:4px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--acc)}
.empty{padding:34px;border-radius:20px;border:1px dashed var(--line);text-align:center;color:var(--tx2)}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:14px}
.feat div{background:var(--ui-solid);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:10px;align-items:center;font-size:13.5px;font-weight:600}
.feat svg.i{color:var(--acc)}

/* ---------- presentation ---------- */
#pres{position:fixed;inset:0;background:var(--stage);overflow:hidden}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
#slidebox{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.04),0 30px 80px rgba(0,0,0,.6);overflow:hidden;will-change:transform}
#slidecontent,#objlayer,#inkc,#livec{position:absolute;left:0;top:0}
#slidecontent>*{position:absolute;inset:0}
#inkc,#livec{pointer-events:none}
#pres.drawing #livec{pointer-events:auto;cursor:crosshair}
#pres.drawing.texttool #livec{cursor:text}
#objlayer{width:100%;height:100%}
#pres.drawing #objlayer{pointer-events:none}
#pres.editobj #livec{pointer-events:none}
#pres.editobj #objlayer{pointer-events:auto;z-index:3}
.obj{position:absolute;transform-origin:50% 50%;touch-action:none}
.obj.txt{padding:6px 10px;line-height:1.3;white-space:pre-wrap;word-break:break-word;outline:none;min-width:40px}
.obj .stx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8%;line-height:1.25;white-space:pre-wrap;word-break:break-word;outline:none}
.obj.editing{cursor:text;z-index:5}
.obj img{position:absolute;pointer-events:none;-webkit-user-drag:none}
.obj.chart{background:#fff;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.obj.chart.tr{background:transparent;box-shadow:none}
.obj>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#sellayer{position:absolute;inset:0;pointer-events:none;z-index:6}
.selb{position:absolute;border:2px solid var(--acc);border-radius:2px;transform-origin:50% 50%}
.hd{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff;border:3px solid var(--acc);pointer-events:auto;touch-action:none;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.hd.rot{background:var(--acc);border-color:#fff}
.rotline{position:absolute;left:50%;top:-34px;width:2px;height:34px;background:var(--acc)}
.otb{position:absolute;display:flex;gap:2px;padding:5px;background:var(--ui);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);pointer-events:auto;white-space:nowrap}
.pop{position:fixed;z-index:9000;background:var(--ui-solid);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px;animation:winIn .15s}
.palette{display:grid;grid-template-columns:repeat(6,34px);gap:8px}
.palette .sw{width:34px;height:34px}
.sw.none{background:linear-gradient(135deg,transparent 45%,var(--bad) 46%,var(--bad) 54%,transparent 55%),var(--ui2)!important}

/* nav */
#nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px;background:var(--ui);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);transition:opacity .5s,transform .3s;z-index:50}
#nav.dim{opacity:.22}
#nav .num{height:44px;min-width:86px;padding:0 12px;border-radius:12px;font-family:var(--mono);font-weight:700;font-size:15px}
#nav .num:hover{background:var(--ui2)}
#nav .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
.badges{position:fixed;left:14px;bottom:18px;display:flex;gap:6px;z-index:40}

/* tool panel */
#handle{position:fixed;right:0;top:50%;transform:translateY(-50%);width:30px;height:88px;border-radius:16px 0 0 16px;background:var(--ui);backdrop-filter:blur(18px);border:1px solid var(--line);border-right:0;display:grid;place-items:center;z-index:60;box-shadow:var(--shadow);transition:opacity .3s,width .2s}
#handle:hover{width:38px}
#handle i{display:block;width:4px;height:34px;border-radius:4px;background:var(--tx2)}
#panel{position:fixed;right:10px;top:50%;transform:translate(calc(100% + 30px),-50%);transition:transform .34s cubic-bezier(.2,.9,.25,1);width:88px;max-height:calc(100vh - 20px);overflow-y:auto;overflow-x:hidden;background:var(--ui);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:24px;padding:8px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;z-index:61;box-shadow:var(--shadow);scrollbar-width:none}
#panel::-webkit-scrollbar{display:none}
#panel.open{transform:translate(0,-50%)}
body.lside #handle{right:auto;left:0;border-radius:0 16px 16px 0;border:1px solid var(--line);border-left:0}
body.lside #panel{right:auto;left:10px;transform:translate(calc(-100% - 30px),-50%)}
body.lside #panel.open{transform:translate(0,-50%)}
.ptop{display:flex;gap:2px;margin-bottom:4px}
.ptop .ib{width:34px;height:34px;border-radius:10px}.ptop svg.i{width:18px;height:18px}
.tb{width:72px;min-height:58px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:15px;font-size:10.5px;font-weight:600;color:var(--tx2);line-height:1.1;text-align:center;transition:background .15s,color .15s}
.tb svg.i{color:var(--tx);width:23px;height:23px}
.tb:hover{background:var(--ui2)}
.tb.on{background:var(--acc);color:#fff}.tb.on svg.i{color:#fff}
.psep{width:44px;height:1px;background:var(--line);margin:4px 0;flex:none}

/* floating bars (draw / focus) */
.fbar{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);display:flex;align-items:center;gap:3px;padding:6px;background:var(--ui);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);z-index:55;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;animation:barIn .25s}
.fbar::-webkit-scrollbar{display:none}
.fbar .sep{width:1px;height:28px;background:var(--line);margin:0 5px;flex:none}
.fbar .sw{width:30px;height:30px}
.wdot{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.wdot i{display:block;border-radius:50%;background:currentColor}
.wdot.on{background:var(--ui3)}
@keyframes barIn{from{opacity:0;transform:translate(-50%,16px)}}

/* windows */
#wins{position:fixed;inset:0;pointer-events:none;z-index:100}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--ui-solid);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;min-width:260px;min-height:170px;animation:winIn .22s cubic-bezier(.2,.9,.3,1)}
@keyframes winIn{from{opacity:0;transform:scale(.96) translateY(8px)}}
.win-h{height:50px;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;cursor:grab;touch-action:none;border-bottom:1px solid var(--line);flex:none}
.win-h:active{cursor:grabbing}
.win-h .wt{font-weight:700;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-h .wi{width:30px;height:30px;border-radius:9px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center}
.win-h .wi svg.i{width:18px;height:18px}
.win-b{flex:1;overflow:auto;position:relative;touch-action:pan-x pan-y}
.win-rs{position:absolute;right:0;bottom:0;width:30px;height:30px;cursor:nwse-resize;touch-action:none;z-index:3;background:linear-gradient(135deg,transparent 55%,var(--tx3) 56%,var(--tx3) 60%,transparent 61%,transparent 70%,var(--tx3) 71%,var(--tx3) 75%,transparent 76%)}
.win.max{left:1.5vw!important;top:1.5vh!important;width:97vw!important;height:97vh!important}
.win.max .win-rs{display:none}
.pad{padding:16px}

/* toasts & loader */
#toasts{position:fixed;left:50%;top:16px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:9999;pointer-events:none;align-items:center}
.toast{background:var(--ui-solid);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;padding:11px 16px;font-weight:600;font-size:14px;animation:winIn .2s;display:flex;gap:8px;align-items:center}
.toast.err{border-color:var(--bad)}
#loader{position:fixed;inset:0;background:rgba(5,7,12,.72);backdrop-filter:blur(6px);z-index:9998;display:grid;place-items:center}
#loader .box{background:var(--ui-solid);border-radius:22px;padding:26px 30px;min-width:300px;text-align:center;box-shadow:var(--shadow)}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--ui3);border-top-color:var(--acc);animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* overlays */
#blackout{position:fixed;inset:0;z-index:80;display:grid;place-items:center;color:rgba(255,255,255,.18);font-size:14px;font-weight:600}
#focusov{position:absolute;inset:0;z-index:7;pointer-events:none}
#focusov.act{pointer-events:auto;touch-action:none}
.lens{position:absolute;border-radius:50%;overflow:hidden;border:4px solid #fff;box-shadow:0 10px 40px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.3);pointer-events:none;z-index:8;background:#fff}
.curtain{position:absolute;left:0;right:0;top:0;background:#0d1018;z-index:7;touch-action:none;display:flex;align-items:flex-end;justify-content:center}
.curtain .grip{width:120px;height:34px;border-radius:12px 12px 0 0;background:var(--acc);color:#fff;display:grid;place-items:center;margin-bottom:-1px;cursor:ns-resize;font-weight:700;font-size:12px}
#thumbs{position:fixed;inset:0;z-index:90;background:rgba(5,7,12,.86);backdrop-filter:blur(10px);display:flex;flex-direction:column;animation:winIn .2s}
#thumbs .th-h{display:flex;align-items:center;gap:10px;padding:14px 20px;color:#fff}
#thumbs .grid{flex:1;overflow:auto;padding:6px 20px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;align-content:start;touch-action:pan-y}
.th{position:relative;border-radius:12px;overflow:hidden;cursor:pointer;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.4);outline:3px solid transparent;transition:outline-color .15s,transform .15s}
.th:hover{transform:translateY(-2px)}
.th.cur{outline-color:var(--acc)}
.th .n{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-weight:700;font-size:12px;padding:3px 8px;border-radius:8px;font-family:var(--mono);z-index:3}
.th .fl{position:absolute;right:8px;top:8px;display:flex;gap:4px;z-index:3}
.th .fl span{background:var(--acc);color:#fff;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:7px}
.th .tin{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.th .del{position:absolute;right:6px;bottom:6px;z-index:4;background:rgba(0,0,0,.6);color:#fff}

/* timer chip */
#tchip{position:fixed;top:14px;right:58px;z-index:70;height:52px;padding:0 16px 0 12px;border-radius:16px;background:var(--ui);backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:24px;font-weight:700;cursor:pointer}
#tchip.warn{color:var(--amb)}#tchip.end{color:#fff;background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}

/* slide rendering (pptx) */
.sld{position:absolute;inset:0;overflow:hidden;font-family:Calibri,Carlito,'Onest',Arial,sans-serif;color:#000;-webkit-user-select:none;user-select:none}
.sld .sp{position:absolute;transform-origin:50% 50%}
.sld .sp>svg{position:absolute;left:0;top:0;overflow:visible}
.sld .txb{position:absolute;inset:0;display:flex;flex-direction:column;overflow:visible;box-sizing:border-box}
.sld .txb p{margin:0;white-space:pre-wrap;overflow-wrap:break-word}
.sld .txb .bu{display:inline-block;text-indent:0}
.sld table{border-collapse:collapse;table-layout:fixed;position:absolute;left:0;top:0}
.sld td{vertical-align:top;overflow:hidden}

  mem: {}, db: null,

  async tx(store, mode, fn) { const d = await this.open(); return new Promise((res, rej) => { const t = d.transaction(store, mode); const q = fn(t.objectStore(store)); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); },
  async get(s, k) { try { return await this.tx(s, 'readonly', o => o.get(k)); } catch { return this.mem[s + '|' + k]; } },
  async set(s, k, v) { try { await this.tx(s, 'readwrite', o => o.put(v, k)); } catch (e) { this.mem[s + '|' + k] = v; console.warn('IDB set', e); } },

    let x = g.x ?? o.x ?? (vw - w) / 2 - (o.modal ? 0 : 60), y = g.y ?? o.y ?? (vh - hh) / 2 - 20;
    x = clamp(x, 8, vw - w - 8); y = clamp(y, 8, vh - hh - 8);

    const head = h('div', { class: 'win-h' }, h('div', { class: 'wi' }, icon(o.icon || 'spark')), h('div', { class: 'wt' }, o.title), ...(o.headExtra || []));

    this.drag(head, el, id, false);

    $('#wins').append(el); this.wins[id] = win; this.focus(id);
    if (o.maximized) el.classList.add('max');

  },

  toggleMax(id) { const w = this.wins[id]; if (w) w.el.classList.toggle('max'); },

/* ---------- Expression parser (тооны машин, функцийн график) ---------- */

/* ---------- Draw toolbar ---------- */

    if ((k === 'Delete' || k === 'Backspace') && Objects.sel && !App.ro) { Objects.remove(Objects.sel); return; }

    const map = { next: () => Pres.next(), next2: () => Pres.next(), prev: () => Pres.prev(), exit: () => Pres.close(), timer: () => Tools.run('timer'), draw: () => Tools.run('draw'), quiz: () => Tools.run('quiz'), random: () => Tools.run('random'), calc: () => Tools.run('calc'), zoom: () => Tools.run('zoom'), notes: () => Tools.run('notes'), black: () => Blackout.toggle(), shapes: () => Tools.run('shapes'), thumbs: () => Thumbs.open(), full: () => Pres.toggleFull() };

/* ---------- Хэрэгслийг самбараас слайд руу чирэх ---------- */
const DragTool = {
  ghost: null,
  bind(btn) {
    const t = Tools.mods[btn.dataset.tool]; if (!t || !t.drop) return;
    btn.title += ' — слайд руу чирж байрлуулна';
    btn.addEventListener('click', e => { if (btn._dragged) { e.stopImmediatePropagation(); e.preventDefault(); btn._dragged = false; } }, true);
    btn.addEventListener('pointerdown', e => {
      if (e.button > 0) return;
      const sx = e.clientX, sy = e.clientY; let drag = false;
      btn.setPointerCapture(e.pointerId);
      const mv = ev => {
        if (!drag && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 10) { drag = true; btn._dragged = true; this.start(t); }
        if (drag) this.move(ev.clientX, ev.clientY);
      };
      const up = ev => {
        btn.removeEventListener('pointermove', mv); btn.removeEventListener('pointerup', up); btn.removeEventListener('pointercancel', up);
        if (!drag) return;
        const over = this.target(ev.clientX, ev.clientY); this.end();
        if (over && ev.type === 'pointerup') { const [x, y] = Pres.toSlide(ev.clientX, ev.clientY); if (!Settings.v.pin) Panel.close(); try { t.drop({ x, y }, { cx: ev.clientX, cy: ev.clientY }); } catch (err) { console.error(err); toast(err.message, 'err'); } }
        setTimeout(() => { btn._dragged = false; }, 50);
      };
      btn.addEventListener('pointermove', mv); btn.addEventListener('pointerup', up); btn.addEventListener('pointercancel', up);
    });
  },
  target(cx, cy) { const el = document.elementFromPoint(cx, cy); if (!el || el.closest('#panel,#nav,.win,.fbar')) return false; const [x, y] = Pres.toSlide(cx, cy); return x >= 0 && y >= 0 && x <= App.W && y <= App.H; },
  start(t) { this.ghost = h('div', { class: 'dragghost' }, icon(t.icon), t.name); document.body.append(this.ghost); $('#slidebox').classList.add('dropzone'); },
  move(x, y) { if (!this.ghost) return; this.ghost.style.transform = `translate(${x + 14}px,${y + 14}px)`; const ok = this.target(x, y); this.ghost.classList.toggle('ok', ok); $('#slidebox').classList.toggle('dropover', ok); },
  end() { this.ghost?.remove(); this.ghost = null; $('#slidebox').classList.remove('dropzone', 'dropover'); },
};

/* =====================================================================
   ИРЦ БҮРТГЭЛ + АНГИ, СУРАГЧИЙН БҮРТГЭЛ
   • Roster  — анги, сурагчдын жагсаалт (тусдаа модуль). Settings.v.classes-д
               хадгалагдах тул Сугалаа, Утсаар сорил зэрэг нь мөн ашиглана.
   • Attend  — зүүн талын ирцийн самбар. Багш өөрөө тэмдэглэх эсвэл QR үүсгэж
               сурагч бүр өөрийн ирцийг нэг удаа бүртгүүлнэ (sambar_server.js).
   Ирцийн бүртгэл: IndexedDB kv 'att' = [{id, cls, clsName, date, period, marks:{нэр:{st,by,t}}}]
   ===================================================================== */
const AST = [['p', 'Ирсэн', 'И', '#22C38E'], ['l', 'Хоцорсон', 'Х', '#F7B32B'], ['e', 'Чөлөөтэй', 'Ч', '#22B8E0'], ['s', 'Өвчтэй', 'Ө', '#A06CFF'], ['a', 'Тасалсан', 'Т', '#FF5C7A']];
const ASTM = Object.fromEntries(AST.map(x => [x[0], x]));
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const hhmm = t => { const d = new Date(t); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const fileSafe = s => String(s || '').replace(/[\\/:*?"<>|]/g, '_');

const Attend = {
  all: null, el: null, cls: null, date: null, period: 1, sess: null, timer: null, qrEl: null,
  async load() { if (!this.all) this.all = (await DB.get('kv', 'att')) || []; return this.all; },
  persist() { clearTimeout(this._st); this._st = setTimeout(() => DB.set('kv', 'att', this.all), 250); },
  get classes() { return Settings.v.classes || []; },
  curCls() { return this.classes.find(c => c.id === this.cls) || null; },
  find(cls, date, period) { return this.all.find(x => x.cls === cls && x.date === date && (x.period || 1) === period); },
  rec(create) {
    const c = this.curCls(); if (!c) return null;
    let r = this.find(c.id, this.date, this.period);
    if (!r && create) { r = { id: uid(), cls: c.id, clsName: c.name, date: this.date, period: this.period, lname: App.L ? (App.L.title || App.L.name || '') : '', marks: {}, created: Date.now(), updated: Date.now() }; this.all.push(r); this.applyDay(c, this.date); }
    return r;
  },

  /* ---------- Ангийн багшийн өдрийн тэмдэглэгээ (сервер) ----------
     Ангийн багш (c.home) Өвчтэй/Чөлөөтэй/Тасалсан гэж тэмдэглэвэл серверт
     хадгалагдаж, тухайн ангид хичээл ордог бусад багшийн самбарт түгжээтэй харагдана. */
  day: {},
  isSub(c) { return !!(c?.sid && !c.home); },
  locks(c, date = this.date) {
    if (!this.isSub(c)) return {};
    const ca = this.day[c.sid + '|' + date];
    if (ca?.marks) return ca.marks;
    const out = {}; for (const r of this.all) if (r.cls === c.id && r.date === date) for (const [n, m] of Object.entries(r.marks)) if (m.by === 'home') out[n] = { st: m.st, t: m.t };
    return out;
  },
  async fetchDay(c, date, force) {
    if (!this.isSub(c)) return false;
    const k = c.sid + '|' + date, ca = this.day[k];
    if (!force && ca && Date.now() - ca.at < 8000) return false;
    this.day[k] = { ...(ca || {}), at: Date.now() };
    try {
      const d = await this.api(`/api/classes/${c.sid}/day/${date}`), marks = d.marks || {};
      const ch = JSON.stringify(ca?.marks || null) !== JSON.stringify(marks);
      this.day[k] = { marks, by: d.by, at: Date.now(), ok: true };
      if (ch) this.applyDay(c, date);
      return ch;
    } catch { this.day[k].ok = false; return false; }
  },
  applyDay(c, date) {
    if (!this.isSub(c)) return; const L = this.locks(c, date); let ch = false;
    for (const r of this.all) if (r.cls === c.id && r.date === date) {
      for (const [n, m] of Object.entries(L)) if (r.marks[n]?.by !== 'home' || r.marks[n].st !== m.st) { r.marks[n] = { st: m.st, by: 'home', t: m.t || Date.now() }; ch = true; }
      for (const [n, m] of Object.entries(r.marks)) if (m.by === 'home' && !L[n]) { delete r.marks[n]; ch = true; }
    }
    if (ch) this.persist();
  },
  pushDay(c, list) {
    if (!c?.sid || !c.home || !list.length) return;
    this.api(`/api/classes/${c.sid}/day/${this.date}`, { me: ImgLib.cid(), marks: list }).catch(e => this.say('Ангийн багшийн тэмдэглэгээг серверт хадгалж чадсангүй: ' + e.message, 'err'));
  },

  /* ---------- Зүүн талын самбар ---------- */
  async open(opt = {}) {
    await this.load();
    const fresh = !this.el;
    if (opt.cls && this.classes.some(c => c.id === opt.cls)) this.cls = opt.cls;
    if (!this.curCls()) this.cls = (this.classes.find(c => c.id === Settings.v.attCls) || this.classes[0])?.id || null;
    if (opt.tab) this.tab = opt.tab;

      });

      box.replaceChildren(h('b', { style: { fontSize: '16px' } }, 'Үнэлгээний бүрэлдэхүүн'), h('div', { class: 'small muted' }, 'Нэр, дээд оноо, хаанаас бодогдохыг тохируулна. Дээд оноо нийлээд 100 байна.'), ...rows,
        h('div', { class: 'row', style: { gap: '8px' } }, h('button', { class: 'btn sm', onclick: () => { comps.push({ id: uid(), name: 'Шинэ', max: 0, src: 'manual' }); draw(); } }, icon('plus'), 'Нэмэх'), h('button', { class: 'btn sm ghost', onclick: () => { comps.splice(0, comps.length, ...GDEF()); draw(); } }, icon('reset'), 'Анхны загвар'), h('div', { class: 'grow' }), tot),
        h('div', { class: 'row', style: { justifyContent: 'flex-end', gap: '8px' } }, h('button', { class: 'btn', onclick: () => ov.remove() }, 'Болих'), h('button', { class: 'btn pri', onclick: () => { d.comps = comps.filter(k => k.name.trim()); this.persist(); ov.remove(); Attend.render(); } }, icon('check'), 'Хадгалах')));
    };
    ov.append(box); draw(); Attend.el?.append(ov);
  },
  splitName(n) { const s = String(n).trim(), m = s.match(/^(\S+?)\.\s*(.+)$/); if (m) return [m[1], m[2]]; const p = s.split(/\s+/); return p.length > 1 ? [p[0], p.slice(1).join(' ')] : ['', s]; },
  /* Загварын дагуу Excel: № | Овог | Нэр | бүрэлдэхүүн… | Нийт | Үнэлгээ + доор нь VIII…I тоо, Total, VII-VIII, V-VIII, Percentage */
  excel(c) {
    const { comps, rows, T, maxSum } = this.compute(c), st = this.stats(rows), n = comps.length, col = XLSXW.col.bind(XLSXW);
    const cT = n + 3, cG = n + 4, R0 = 4, R1 = R0 + rows.length - 1, L = col(cT), G = col(cG);
    const S = [];

    S.push([{ v: '', s: 22 }, { v: '', s: 22 }, { v: '', s: 22 }, ...comps.map(k => ({ v: +k.max, s: 22 })), { v: maxSum, s: 22 }, { v: '', s: 22 }]);
    S.push([]);
    rows.forEach((r, i) => {
      const row = R0 + i, [o, nm] = this.splitName(r.name);
      const gf = `IF(${L}${row}>=90,"VIII",IF(${L}${row}>=80,"VII",IF(${L}${row}>=70,"VI",IF(${L}${row}>=60,"V",IF(${L}${row}>=50,"IV",IF(${L}${row}>=40,"III",IF(${L}${row}>=30,"II","I")))))))`;
      S.push([{ v: i + 1, s: 23 }, { v: o, s: 23 }, { v: nm, s: 23 }, ...comps.map(k => { const v = r.vals[k.id].v; return v == null ? { v: '', s: 17 } : { v: r1(v), s: 17 }; }),
        { v: r.total, f: `ROUND(SUM(D${row}:${col(n + 2)}${row}),0)`, s: r.total >= 80 ? 20 : r.total >= 60 ? 19 : 18 }, { v: r.grade, f: gf, s: 24 }]);

    const rTot = base + GRADES.length, ref = k => `${G}${base + GRADES.findIndex(x => x[0] === k)}`;
    S.push([...pad(), { v: 'Total', s: 24 }, { v: st.n, f: `COUNTA(${rng})`, s: 24 }]);
    S.push([...pad(), { v: 'VII-VIII', s: 24 }, { v: st.q, f: `IF(${G}${rTot}=0,0,(${ref('VIII')}+${ref('VII')})/${G}${rTot})`, s: 25 }]);
    S.push([...pad(), { v: 'V-VIII', s: 24 }, { v: st.s, f: `IF(${G}${rTot}=0,0,(${ref('VIII')}+${ref('VII')}+${ref('VI')}+${ref('V')})/${G}${rTot})`, s: 25 }]);
    S.push([...pad(), { v: 'Percentage', s: 24 }, { v: r1(st.avg), f: `IFERROR(AVERAGE($${L}$${R0}:$${L}$${Math.max(R0, R1)}),0)`, s: 21 }]);
    const sheet = { name: `${c.name} ${T.name}`.slice(0, 31), rows: S, cols: [5, 16, 16, ...comps.map(k => Math.max(10, Math.min(18, k.name.length + 3))), 11, 10], freeze: { r: 2, c: 3 }, heights: Object.assign({ 0: 30, 1: 18, 2: 6 }, ...S.map((_, i) => i >= 3 ? { [i]: 18 } : {})), page: { landscape: true }, header: { l: `${c.name} анги — ${T.name}`, r: `${T.from} — ${T.to}` } };
    downloadBlob(XLSXW.build([sheet]), `Үнэлгээ_${fileSafe(c.name)}_${fileSafe(T.name)}.xlsx`);

};

/* ---------- Ангийн самбарын хэрэгслүүд ---------- */
Tools.reg({ id: 'act', name: 'Идэвхи', icon: 'raise', group: 3, panel: 2, run: () => Attend.show('act'), active: () => !!Attend.el && Attend.tab === 'act' });

/* =====================================================================
   ХЭРЭГСЛИЙН 2 САМБАР + ТОХИРГОО
   • Самбар 1 «Хэрэгсэл» (зурах, дүрс, зураг, цаг …)   — Settings.v.side  (анх: баруун)
   • Самбар 2 «Анги»    (ирц, сорил, гэрийн даалгавар, идэвхи, үнэлгээ) — Settings.v.side2 (анх: зүүн)
   Багш дараалал (чирэх / ↑↓), нуух, хэрэгслийг нөгөө самбар руу шилжүүлэх боломжтой.
   Settings.v.toolOrder = [id…] · toolHidden = [id…] · toolPanel = { id: 1|2 }
   ===================================================================== */
const ToolCfg = {
  locked: new Set(['settings']),  // нуух боломжгүй (тохиргоо руу буцах зам)
  panelOf(t) { const o = (Settings.v.toolPanel || {})[t.id]; return o === 1 || o === 2 ? o : (t.panel === 2 ? 2 : 1); },
  base() { return Tools.list.filter(t => !t.hidden).slice().sort((a, b) => a.group - b.group); },
  ordered(k) {

      const byId = Object.fromEntries(base.map(t => [t.id, t])); out = ord.map(id => byId[id]).filter(Boolean);

  },
  isHidden(id) { return !this.locked.has(id) && (Settings.v.toolHidden || []).includes(id); },
  custom() { return Array.isArray(Settings.v.toolOrder) && Settings.v.toolOrder.length > 0; },
  commit(ids1, ids2) { Settings.v.toolOrder = [...ids1, ...ids2]; Settings.save(); Panel.build(); },
  setHidden(id, hide) { const s = new Set(Settings.v.toolHidden || []); hide ? s.add(id) : s.delete(id); Settings.v.toolHidden = [...s]; Settings.save(); Panel.build(); },
  move(id, k) { Settings.v.toolPanel = { ...(Settings.v.toolPanel || {}), [id]: k }; Settings.save(); Panel.build(); },
  reset() { Settings.v.toolOrder = null; Settings.v.toolHidden = []; Settings.v.toolPanel = {}; Settings.save(); Panel.build(); },

  /* Тохиргооны цонхон дахь хэсэг: самбар тус бүрийн жагсаалт */
  section() {
    const wrap = h('div', { class: 'tcfg2' });
    const lists = { 1: h('div', { class: 'tcfg', 'data-k': 1 }), 2: h('div', { class: 'tcfg', 'data-k': 2 }) };
    const ids = k => [...lists[k].children].map(r => r.dataset.id).filter(Boolean);
    const draw = () => {
      for (const k of [1, 2]) {
        const tools = this.ordered(k), n = tools.length;
        lists[k].replaceChildren(...tools.map((t, i) => {
          const hid = this.isHidden(t.id), lock = this.locked.has(t.id);
          const swap = d => { const a = tools.map(x => x.id), j = i + d; if (j < 0 || j >= n) return; [a[i], a[j]] = [a[j], a[i]]; k === 1 ? this.commit(a, ids(2)) : this.commit(ids(1), a); draw(); };
          const row = h('div', { class: 'tcfgr' + (hid ? ' off' : ''), 'data-id': t.id },
            h('span', { class: 'tcfgh', title: 'Чирж байрлалыг өөрчилнө' }, '⠿'),
            h('span', { class: 'tcfgi' }, icon(t.icon)), h('span', { class: 'tcfgn' }, t.name, hid ? h('em', {}, ' — нуусан') : null),
            ib('up', 'Дээш', () => swap(-1), 'sm'), ib('down', 'Доош', () => swap(1), 'sm'),
            h('button', { class: 'btn sm ghost tcfgmv', title: k === 1 ? 'Ангийн самбар руу шилжүүлэх' : 'Хэрэгслийн самбар руу шилжүүлэх', onclick: () => { this.move(t.id, k === 1 ? 2 : 1); draw(); } }, k === 1 ? '→ Анги' : '→ Хэрэгсэл'),
            lock ? h('span', { class: 'small muted', style: { width: '46px', textAlign: 'center' }, title: 'Тохиргоо руу орох замыг үргэлж харуулна' }, '🔒') : toggleEl(!hid, on => { this.setHidden(t.id, !on); draw(); }));
          if (i === 0) row.querySelector('[title="Дээш"]').disabled = true;
          if (i === n - 1) row.querySelector('[title="Доош"]').disabled = true;
          return row;
        }));
        if (!n) lists[k].append(h('div', { class: 'small muted', style: { padding: '8px' } }, 'Хоосон самбар — харагдахгүй.'));
      }
    };
    // Бариулаас чирж эрэмбэлэх (нөгөө самбарын жагсаалт руу чирвэл шилжинэ)
    wrap.addEventListener('pointerdown', e => {
      const hd = e.target.closest('.tcfgh'); if (!hd) return;
      const row = hd.closest('.tcfgr'); e.preventDefault(); row.classList.add('drag');
      const sc = wrap.closest('.win-b');
      const mv = ev => {
        if (sc) { const b = sc.getBoundingClientRect(); if (ev.clientY < b.top + 40) sc.scrollTop -= 14; else if (ev.clientY > b.bottom - 40) sc.scrollTop += 14; }
        let list = lists[1]; for (const k of [1, 2]) { const b = lists[k].getBoundingClientRect(); if (ev.clientY >= b.top - 20 && ev.clientY <= b.bottom + 20) list = lists[k]; }
        if (ev.clientY > lists[2].getBoundingClientRect().top - 20) list = lists[2]; else if (ev.clientY < lists[1].getBoundingClientRect().bottom + 20) list = lists[1];
        const rows = [...list.querySelectorAll('.tcfgr')].filter(r => r !== row);
        let before = null; for (const r of rows) { const b = r.getBoundingClientRect(); if (ev.clientY < b.top + b.height / 2) { before = r; break; } }

      const up = () => {

    wrap.append(
      h('div', { class: 'tcfghd' }, h('b', {}, '🧰 Хэрэгслийн самбар'), h('div', { class: 'grow' }), h('span', { class: 'small muted' }, 'Байрлал'), sideSeg('side', 'right')), lists[1],
      h('div', { class: 'tcfghd', style: { marginTop: '14px' } }, h('b', {}, '🏫 Ангийн самбар'), h('div', { class: 'grow' }), h('span', { class: 'small muted' }, 'Байрлал'), sideSeg('side2', 'left')), lists[2]);
    return h('div', { id: 'tcfgsec' },
      h('span', { class: 'lbl', style: { marginTop: '22px' } }, 'Самбарууд — дараалал, байрлал, харагдах байдал'),
      h('div', { class: 'muted small', style: { margin: '2px 0 8px', lineHeight: 1.5 } }, '⠿ бариулаас чирж эсвэл ↑↓ товчоор байрлалыг өөрчилнө. «→ Анги / → Хэрэгсэл» товчоор (эсвэл нөгөө жагсаалт руу чирж) хэрэгслийг самбар хооронд шилжүүлнэ. Шаардлагагүй хэрэгслийг унтраавал нуугдана (гарын товчлол ажилласаар байна).'),

      h('div', { class: 'row', style: { marginTop: '10px' } }, h('button', { class: 'btn sm', onclick: () => { this.reset(); draw(); } }, icon('reset'), 'Анхны байдалд оруулах')));
  },
  open() { SettingsTool.open(); setTimeout(() => { const s = $('#tcfgsec'); s?.scrollIntoView({ block: 'start', behavior: 'smooth' }); }, 80); },
};

/* ---------- Хоёр самбар ---------- */
Panel.el = k => k === 2 ? $('#panel2') : $('#panel');
Panel.ensure = function () {
  if ($('#panel2')) return;
  const p1 = $('#panel'), h1 = $('#handle');
  const h2 = h('button', { id: 'handle2', title: 'Ангийн самбар (ирц, сорил, даалгавар, идэвхи, үнэлгээ)' }, h('i'));
  const p2 = h('div', { id: 'panel2' });
  h1.after(h2); p1.after(p2);
};
Panel.layout = function () {
  const s1 = Settings.v.side || 'right', s2 = Settings.v.side2 || 'left', same = s1 === s2;
  const p2 = $('#panel2'), h2 = $('#handle2'); if (!p2) return;
  for (const el of [p2, h2]) { el.classList.toggle('L', s2 === 'left'); el.classList.toggle('R', s2 === 'right'); el.classList.toggle('stack', same); }
  const has2 = !App.ro && p2.querySelector('.tb');
  p2.style.display = has2 ? '' : 'none'; h2.style.display = has2 ? '' : 'none';
};
Panel.build = function () {
  this.ensure();
  for (const k of [1, 2]) {
    const p = this.el(k); p.replaceChildren();
    const pin = ib('pin', Settings.v.pin ? 'Тогтоолтыг авах' : 'Тогтоох', () => { Settings.v.pin = !Settings.v.pin; Settings.save(); this.build(); }, Settings.v.pin ? 'on' : '');
    p.append(h('div', { class: 'ptop' }, pin, App.ro ? null : ib('edit', 'Самбарыг тохируулах (дараалал, байрлал, нуух)', () => { this.close(); ToolCfg.open(); }, 'sm'), ib('x', 'Хаах', () => this.close(k))));
    if (k === 2) p.append(h('div', { class: 'ptitle' }, 'АНГИ'));
    const custom = ToolCfg.custom(); let grp = null;
    for (const t of ToolCfg.ordered(App.ro ? 0 : k)) {
      if (App.ro) { if (k === 2 || !t.student) continue; }
      else if (ToolCfg.isHidden(t.id)) continue;
      if (!custom && k === 1 && grp !== null && t.group !== grp) p.append(h('div', { class: 'psep' }));
      grp = t.group;
      const key = t.key && Settings.v.keys[t.key];
      p.append(h('button', { class: 'tb', 'data-tool': t.id, title: t.name + (key ? ` (${key.toUpperCase()})` : ''), onclick: () => Tools.run(t.id) }, icon(t.icon), t.name));
    }
  }
  $('#handle').onclick = () => this.toggle(1); $('#handle2').onclick = () => this.toggle(2);
  $$('#panel .tb, #panel2 .tb').forEach(b => DragTool.bind(b));
  this.layout();
  if (Settings.v.pin) { this.open(1); this.open(2); }
  this.sync();
};
Panel.toggle = function (k = 1) { this.el(k)?.classList.contains('open') ? this.close(k) : this.open(k); };
Panel.open = function (k = 1) { const p = this.el(k); if (!p) return; p.classList.add('open'); ($(k === 2 ? '#handle2' : '#handle')).style.opacity = 0; };
Panel.close = function (k) {
  if (Settings.v.pin) return;
  for (const i of k ? [k] : [1, 2]) { const p = this.el(i); if (!p) continue; p.classList.remove('open'); const hd = $(i === 2 ? '#handle2' : '#handle'); if (hd) hd.style.opacity = 1; }
};
Panel.sync = function () {
  $$('#panel .tb, #panel2 .tb').forEach(b => { const t = Tools.mods[b.dataset.tool]; b.classList.toggle('on', !!(t && t.active && t.active())); });
  for (const k of [1, 2]) if (this.el(k)?.classList.contains('open')) { const hd = $(k === 2 ? '#handle2' : '#handle'); if (hd) hd.style.opacity = 0; }
};
// Талыг солиход самбаруудыг дахин байрлуулна
{ const ap = Settings.apply.bind(Settings); Settings.apply = function () { ap(); try { Panel.layout?.(); if (Attend.el) Attend.place(); } catch { } }; }
// Чирж буулгах үед хоёр самбарыг хоёуланг нь «самбар биш» гэж үзнэ
{ const tg = DragTool.target.bind(DragTool); DragTool.target = (cx, cy) => { const el = document.elementFromPoint(cx, cy); if (el && el.closest('#panel2,#handle2,#attp,#attqr')) return false; return tg(cx, cy); }; }

/* Тохиргооны цонхонд хэсгийг «Гарын товчлол»-ын өмнө оруулна */
{
  const orig = SettingsTool.open.bind(SettingsTool);
  SettingsTool.open = function () {
    orig();
    const w = Win.wins.settings; if (!w) return;
    const pad = w.body.querySelector('.pad'), kb = [...pad.querySelectorAll('.lbl')].find(x => x.textContent.startsWith('Гарын товчлол'));

}

  matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', () => Settings.apply());
  if (STUDENT) { document.body.classList.add('student'); await Student.render(); } else await Home.render();
  if (!('DecompressionStream' in window)) toast('Энэ хөтөч хуучин тул PPTX нээх боломжгүй. Chrome/Edge-ийн шинэ хувилбар ашиглана уу.', 'err', 9000);
})();
